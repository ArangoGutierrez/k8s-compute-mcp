# Example JobSet manifest generated by k8s-compute-mcp submit_monte_carlo_batch tool.
# API: jobset.x-k8s.io/v1alpha2 (Kubernetes JobSet)
#
# This manifest runs 10 parallel Monte Carlo simulation replicas.
# Each pod gets a unique JOB_COMPLETION_INDEX (injected by Kubernetes for indexed jobs)
# which should be used to create unique output file paths on the shared PVC.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: mc-20260305-x9y8z
  namespace: compute
  annotations:
    kueue.x-k8s.io/queue-name: default-queue
spec:
  replicatedJobs:
    - name: workers
      replicas: 1
      template:
        spec:
          parallelism: 10
          completions: 10
          completionMode: Indexed
          backoffLimit: 3
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: worker
                  image: python:3.11-slim
                  command: ["python", "-c"]
                  args:
                    - |
                      import os, json, random, math

                      idx = os.environ['JOB_COMPLETION_INDEX']
                      mount = os.environ['MOUNT_PATH']

                      samples = 1_000_000
                      inside = sum(1 for _ in range(samples)
                                   if math.hypot(random.random(), random.random()) <= 1.0)
                      pi_est = 4.0 * inside / samples

                      with open(f'{mount}/results_{idx}.json', 'w') as f:
                          json.dump({'index': int(idx), 'samples': samples, 'pi_estimate': pi_est}, f)
                  env:
                    - name: MOUNT_PATH
                      value: /mnt/data
                  resources:
                    requests:
                      cpu: 500m
                      memory: 1Gi
                    limits:
                      cpu: "1"
                      memory: 2Gi
                  volumeMounts:
                    - name: data
                      mountPath: /mnt/data
              volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: compute-data
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - workers
