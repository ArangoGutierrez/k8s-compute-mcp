# Example MPIJob manifest generated by k8s-compute-mcp submit_mpi_job tool.
# API: kubeflow.org/v2beta1 (Kubeflow MPI Operator)
#
# This manifest runs a Python MPI program across 4 worker nodes.
# The launcher pod coordinates mpirun; worker pods execute the computation.
apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: mpi-20260305-a1b2c
  namespace: compute
  annotations:
    kueue.x-k8s.io/queue-name: default-queue
spec:
  slotsPerWorker: 1
  runPolicy:
    cleanPodPolicy: Running
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: launcher
              image: mpioperator/openmpi-builder:latest
              command: ["mpirun"]
              args:
                - "--allow-run-as-root"
                - "-np"
                - "4"
                - "python"
                - "-c"
                - |
                  from mpi4py import MPI
                  import numpy as np

                  comm = MPI.COMM_WORLD
                  rank = comm.Get_rank()
                  size = comm.Get_size()

                  local = np.random.rand(1000)
                  total = np.zeros(1) if rank == 0 else None
                  comm.Reduce(np.sum(local), total, op=MPI.SUM, root=0)

                  if rank == 0:
                      print(f'Sum across {size} ranks: {total[0]}')
              env:
                - name: MOUNT_PATH
                  value: /mnt/data
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
              volumeMounts:
                - name: data
                  mountPath: /mnt/data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: compute-data
    Worker:
      replicas: 4
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: worker
              image: mpioperator/openmpi-builder:latest
              env:
                - name: MOUNT_PATH
                  value: /mnt/data
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
              volumeMounts:
                - name: data
                  mountPath: /mnt/data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: compute-data
