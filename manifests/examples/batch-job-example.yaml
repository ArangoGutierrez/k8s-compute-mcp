# Example Batch Job manifest generated by k8s-compute-mcp submit_reducer tool.
# API: batch/v1 (Kubernetes core)
#
# This manifest runs a single reducer pod that aggregates results from
# Monte Carlo simulation outputs on the shared PVC.
apiVersion: batch/v1
kind: Job
metadata:
  name: reduce-20260305-k3m4n
  namespace: compute
  annotations:
    kueue.x-k8s.io/queue-name: default-queue
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: reducer
          image: python:3.11-slim
          command: ["python", "-c"]
          args:
            - |
              import glob, json, os

              mount = os.environ['MOUNT_PATH']
              pattern = os.environ.get('INPUT_PATTERN', f'{mount}/results_*.json')

              estimates = []
              for path in sorted(glob.glob(pattern)):
                  with open(path) as f:
                      data = json.load(f)
                      estimates.append(data['pi_estimate'])

              pi_avg = sum(estimates) / len(estimates)
              print(f'Averaged {len(estimates)} estimates: pi ~ {pi_avg:.6f}')

              with open(f'{mount}/final_result.json', 'w') as f:
                  json.dump({'pi': pi_avg, 'num_estimates': len(estimates)}, f)
          env:
            - name: INPUT_PATTERN
              value: /mnt/data/results_*.json
            - name: MOUNT_PATH
              value: /mnt/data
          volumeMounts:
            - name: data
              mountPath: /mnt/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: compute-data
