# Default values for k8s-compute-mcp.

replicaCount: 1

image:
  repository: ghcr.io/arangogutierrez/k8s-compute-mcp
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # Specifies whether RBAC resources should be created
  create: true
  # When false (default), creates namespace-scoped Role and RoleBinding.
  # When true, creates cluster-wide ClusterRole and ClusterRoleBinding.
  clusterWide: false

# Disable SA token mount by default (app uses kubeconfig, not in-cluster auth)
automountServiceAccountToken: false

# Pod-level security context (applied to the pod spec)
# UID 65532 matches the distroless nonroot image
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

# Container-level security context (applied to each container)
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

service:
  metricsPort: 8080

probes:
  liveness:
    httpGet:
      path: /healthz
      port: metrics
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    httpGet:
      path: /readyz
      port: metrics
    initialDelaySeconds: 5
    periodSeconds: 10

nodeSelector: {}

tolerations: []

affinity: {}
