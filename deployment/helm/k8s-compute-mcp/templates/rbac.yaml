{{- if .Values.rbac.create -}}
{{- if .Values.rbac.clusterWide }}
# Cluster-wide RBAC: ClusterRole + ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-compute-mcp.fullname" . }}
  labels:
    {{- include "k8s-compute-mcp.labels" . | nindent 4 }}
rules:
  # Core API: pods (create/delete for ephemeral reader pods), pod logs
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # Batch API: Jobs (create for reducer jobs)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
  # Kubeflow MPI Operator: MPIJobs
  - apiGroups: ["kubeflow.org"]
    resources: ["mpijobs"]
    verbs: ["get", "list", "watch", "create"]
  # JobSet API: JobSets (for Monte Carlo batch)
  - apiGroups: ["jobset.x-k8s.io"]
    resources: ["jobsets"]
    verbs: ["get", "list", "watch", "create"]
  # Cluster-wide extras: namespace and node visibility
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-compute-mcp.fullname" . }}
  labels:
    {{- include "k8s-compute-mcp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-compute-mcp.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-compute-mcp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
# Namespace-scoped RBAC: Role + RoleBinding (default, least-privilege)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-compute-mcp.fullname" . }}
  labels:
    {{- include "k8s-compute-mcp.labels" . | nindent 4 }}
rules:
  # Core API: pods (create/delete for ephemeral reader pods), pod logs
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # Batch API: Jobs (create for reducer jobs)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
  # Kubeflow MPI Operator: MPIJobs
  - apiGroups: ["kubeflow.org"]
    resources: ["mpijobs"]
    verbs: ["get", "list", "watch", "create"]
  # JobSet API: JobSets (for Monte Carlo batch)
  - apiGroups: ["jobset.x-k8s.io"]
    resources: ["jobsets"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8s-compute-mcp.fullname" . }}
  labels:
    {{- include "k8s-compute-mcp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k8s-compute-mcp.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-compute-mcp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
