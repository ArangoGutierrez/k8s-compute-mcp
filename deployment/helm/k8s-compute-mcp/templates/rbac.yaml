{{- if .Values.rbac.create -}}
{{- if .Values.rbac.clusterWide }}
# Cluster-wide RBAC: ClusterRole + ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-compute-mcp.fullname" . }}
  labels:
    {{- include "k8s-compute-mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-compute-mcp.fullname" . }}
  labels:
    {{- include "k8s-compute-mcp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-compute-mcp.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-compute-mcp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
# Namespace-scoped RBAC: Role + RoleBinding (default, least-privilege)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-compute-mcp.fullname" . }}
  labels:
    {{- include "k8s-compute-mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8s-compute-mcp.fullname" . }}
  labels:
    {{- include "k8s-compute-mcp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k8s-compute-mcp.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-compute-mcp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
